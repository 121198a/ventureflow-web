<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#12b0f0"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7b2ff7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="#f7f9fc"/>
  <circle cx="320" cy="240" r="230" fill="url(#softGlow)"/>

  <!-- connective lattice representing a network of deals/founders/investors -->
  <g stroke="#c9d4e6" stroke-width="1.5">
    <line x1="150" y1="150" x2="320" y2="240"/>
    <line x1="480" y1="140" x2="320" y2="240"/>
    <line x1="150" y1="340" x2="320" y2="240"/>
    <line x1="480" y1="350" x2="320" y2="240"/>
    <line x1="320" y1="90" x2="320" y2="240"/>
    <line x1="320" y1="390" x2="320" y2="240"/>
    <line x1="150" y1="150" x2="320" y2="90"/>
    <line x1="480" y1="140" x2="320" y2="90"/>
    <line x1="150" y1="340" x2="320" y2="390"/>
    <line x1="480" y1="350" x2="320" y2="390"/>
  </g>

  <!-- satellite nodes -->
  <g stroke="#8fa2c2" stroke-width="1.5" fill="#ffffff">
    <circle cx="150" cy="150" r="10"/>
    <circle cx="480" cy="140" r="8"/>
    <circle cx="150" cy="340" r="8"/>
    <circle cx="480" cy="350" r="10"/>
    <circle cx="320" cy="90" r="7"/>
    <circle cx="320" cy="390" r="7"/>
  </g>

  <!-- central hub in brand gradient -->
  <circle cx="320" cy="240" r="46" fill="url(#brandGrad)"/>
  <circle cx="320" cy="240" r="46" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- small orbiting accent rings -->
  <circle cx="320" cy="240" r="72" fill="none" stroke="#7b2ff7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 6"/>
  <circle cx="320" cy="240" r="98" fill="none" stroke="#12b0f0" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 6"/>
</svg>
