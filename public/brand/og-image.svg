<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#12b0f0"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.82" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#eaf0fb" stop-opacity="1"/>
      <stop offset="1" stop-color="#f7f9fc" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- faint lattice echoing the hero illustration, top-right -->
  <g stroke="#dbe3f0" stroke-width="1.5">
    <line x1="880" y1="90" x2="1040" y2="60"/>
    <line x1="880" y1="90" x2="1060" y2="160"/>
    <line x1="880" y1="90" x2="990" y2="220"/>
    <line x1="1040" y1="60" x2="1060" y2="160"/>
  </g>
  <g fill="#ffffff" stroke="#c9d4e6" stroke-width="1.5">
    <circle cx="1040" cy="60" r="6"/>
    <circle cx="1060" cy="160" r="6"/>
    <circle cx="990" cy="220" r="6"/>
  </g>
  <circle cx="880" cy="90" r="16" fill="url(#mark)"/>

  <!-- brand mark, large -->
  <g transform="translate(90,205)">
    <circle cx="55" cy="55" r="55" fill="url(#mark)"/>
    <path d="M32 32 V70 C32 82 41 91 55 91 C69 91 78 82 78 70 V32"
          fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  </g>

  <text x="230" y="270" font-family="Figtree" font-weight="800" font-size="64" fill="#07111f">UnBound X</text>
  <text x="230" y="320" font-family="Figtree" font-weight="800" font-size="30" fill="#2563eb" letter-spacing="1">UBVERSE PLATFORM</text>

  <text x="90" y="410" font-family="Figtree" font-weight="800" font-size="40" fill="#0f172a">Evaluate and invest in private</text>
  <text x="90" y="460" font-family="Figtree" font-weight="800" font-size="40" fill="#0f172a">markets with institutional rigor.</text>

  <rect x="90" y="500" width="230" height="3" fill="#e2e8f0"/>
  <text x="90" y="545" font-family="Figtree" font-weight="600" font-size="24" fill="#475569">Structured deal pages · Founder updates</text>
  <text x="90" y="580" font-family="Figtree" font-weight="600" font-size="24" fill="#475569">Registered broker-dealer execution</text>
</svg>
