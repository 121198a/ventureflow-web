# Optional Docker Compose setup for local testing or 1-command VPS deployment.
# Usage:
#   docker compose up -d --build
#   docker compose down

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventureflow-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
